services:
  microatlas-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: microatlas-frontend:latest
    restart: unless-stopped
    init: true
    ports:
      - "${MICROATLAS_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
